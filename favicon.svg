<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#020817"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0ea5e9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>

  <!-- Gradient border -->
  <rect width="100" height="100" rx="24" fill="none"
        stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- PB letters -->
  <text x="50" y="66"
        font-family="Arial Black, Arial, sans-serif"
        font-size="38"
        font-weight="900"
        fill="url(#textGrad)"
        text-anchor="middle"
        letter-spacing="-1">PB</text>
</svg>
